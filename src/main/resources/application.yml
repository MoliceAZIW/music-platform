server:
  port: 3140
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/music_platform?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
  type-aliases-package: com.example.music.entity

#配置秘钥
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000

#检修时移除注释
#debug: true
#logging:
#  level:
#    org.springframework: DEBUG
#    com.baomidou: DEBUG
logging:
  level:
    com.example.music: DEBUG
